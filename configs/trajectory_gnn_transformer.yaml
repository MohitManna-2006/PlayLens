# PlayLens trajectory model: spatial GNN (GATv2 over kNN player graphs) + temporal Transformer.
# Rationale for each value: docs/decisions/ADR-0004-spatial-temporal-encoder.md
model_name: trajectory-gnn-transformer
model_version: trajectory-gnn-transformer-v1
seed: 7
export: true

data:
  subset: full
  window: 20          # 2.0 s of observed context; 86% of plays fill it, shorter ones are front-padded and masked
  horizon: auto_q95   # smallest H covering 95% of train target players' supplied futures

model:
  hidden: 96
  categorical_dim: 8
  knn: 4
  gnn_layers: 2
  gnn_heads: 4
  transformer_layers: 2
  transformer_heads: 4
  ff_mult: 2
  dropout: 0.1
  embedding_dim: 128
  interaction_layer: true
  head_hidden: 192
  target_representation: residual_cv

train:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  patience: 6
  warmup_epochs: 1.0
  grad_clip: 1.0
  mirror_probability: 0.5
  device: auto
  num_workers: 0
  max_train_plays: null

tracking:
  mlflow: true
  experiment: playlens-trajectory
  tracking_uri: null
