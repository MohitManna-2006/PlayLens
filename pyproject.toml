[project]
name = "playlens-workspace"
version = "0.1.0"
description = "PlayLens ML and API Workspace"
requires-python = ">=3.12"
# Depending on both members makes a plain `uv sync` install the whole workspace.
dependencies = ["playlens-api", "playlens-ml"]

[tool.uv.sources]
playlens-api = { workspace = true }
playlens-ml = { workspace = true }

[tool.uv.workspace]
members = [
    "services/api",
    "ml"
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Markdown table templates for the generated retrieval report.
"services/api/src/playlens_api/retrieval/benchmark.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch_geometric.*", "yaml", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ml/tests", "services/api/tests"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
