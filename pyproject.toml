[project]
name = "playlens-workspace"
version = "0.1.0"
description = "PlayLens ML and API Workspace"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "services/api",
    "ml"
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
